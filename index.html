<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finodev | Links</title>
    <meta property="og:title" content="Finodev">
    <meta property="og:description" content="Developer & Gamer">
    <meta property="og:image" content="https://github.com/Finodev.png">
    <link rel="icon" href="https://github.com/Finodev.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #f0a8d0;
            --lavender: #c4b5fd;
            --blue: #7dd3fc;
            --dark: #0f0f1a;
            --card-bg: rgba(15,15,30,0.65);
            --border: rgba(255,255,255,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 90px;
            overflow-x: hidden;
            background: var(--dark);
            position: relative;
        }

        /* BG */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(135deg,#1a0533,#0f0f2a,#001a33);
            overflow: hidden;
        }
        .bg::before {
            content:''; position:absolute; width:600px; height:600px; border-radius:50%;
            background: radial-gradient(circle,rgba(196,181,253,.18) 0%,transparent 70%);
            top:-150px; left:-150px;
            animation: drift1 12s ease-in-out infinite alternate;
        }
        .bg::after {
            content:''; position:absolute; width:500px; height:500px; border-radius:50%;
            background: radial-gradient(circle,rgba(240,168,208,.15) 0%,transparent 70%);
            bottom:-100px; right:-100px;
            animation: drift2 10s ease-in-out infinite alternate;
        }
        .bg-extra {
            position:absolute; width:400px; height:400px; border-radius:50%;
            background: radial-gradient(circle,rgba(125,211,252,.12) 0%,transparent 70%);
            bottom:20%; left:10%;
            animation: drift1 14s ease-in-out infinite alternate-reverse;
        }
        .stars { position:absolute; inset:0; }
        .star {
            position:absolute; background:white; border-radius:0;
            animation: twinkle var(--d) ease-in-out infinite;
        }
        @keyframes drift1 { from{transform:translate(0,0) scale(1)} to{transform:translate(60px,40px) scale(1.1)} }
        @keyframes drift2 { from{transform:translate(0,0) scale(1)} to{transform:translate(-50px,-30px) scale(1.08)} }
        @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.5)} }

        /* INTRO */
        #intro {
            position:fixed; inset:0; z-index:100;
            background:#0f0f1a;
            display:flex; align-items:center; justify-content:center;
            flex-direction:column; gap:16px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #intro.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .intro-logo {
            width:72px; height:72px; border-radius:50%;
            border:2px solid rgba(196,181,253,.4);
            animation: pulse-intro 1.5s ease-in-out infinite;
        }
        .intro-text {
            font-family:'Space Mono',monospace; color:rgba(255,255,255,.5);
            font-size:13px; letter-spacing:3px; text-transform:uppercase;
        }
        .intro-bar { width:160px; height:2px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
        .intro-bar-fill {
            height:100%;
            background: linear-gradient(90deg,var(--pink),var(--lavender),var(--blue));
            width:0%; animation: load-bar 1.4s cubic-bezier(.4,0,.2,1) forwards;
        }
        @keyframes load-bar { to{width:100%} }
        @keyframes pulse-intro {
            0%,100%{box-shadow:0 0 0 0 rgba(196,181,253,.3)}
            50%{box-shadow:0 0 0 10px rgba(196,181,253,0)}
        }

        /* CURSOR TRAIL */
        .trail-dot {
            position:fixed; pointer-events:none; z-index:9999;
            border-radius:0; image-rendering:pixelated;
        }

        /* CONTAINER */
        .container {
            position:relative; z-index:1;
            width:100%; max-width:420px;
            animation: fadeUp .7s cubic-bezier(.22,1,.36,1) both;
            animation-delay: 1.6s;
            opacity: 0;
        }
        @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

        /* CARD */
        .card {
            background:var(--card-bg);
            backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
            border:1px solid var(--border); border-radius:28px;
            padding:36px 24px 28px; text-align:center;
            box-shadow:0 0 0 1px rgba(196,181,253,.08),0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
        }

        /* AVATAR */
        .avatar-wrap { position:relative; display:inline-block; margin-bottom:18px; }
        .avatar {
            width:100px; height:100px; border-radius:50%; object-fit:cover;
            display:block; position:relative; z-index:1; image-rendering:pixelated;
            border:3px solid transparent;
            background: linear-gradient(var(--dark),var(--dark)) padding-box,
                        linear-gradient(135deg,var(--pink),var(--lavender),var(--blue)) border-box;
        }
        .avatar-ring {
            position:absolute; inset:-6px; border-radius:50%;
            background: conic-gradient(from 0deg,var(--pink),var(--lavender),var(--blue),var(--pink));
            animation:spin 4s linear infinite; opacity:.6; z-index:0;
        }
        .avatar-ring::after {
            content:''; position:absolute; inset:4px; border-radius:50%; background:var(--dark);
        }
        @keyframes spin { to{transform:rotate(360deg)} }
        .status {
            position:absolute; bottom:4px; right:4px;
            width:14px; height:14px; background:#4ade80;
            border-radius:0; border:2px solid var(--dark); z-index:2;
            image-rendering:pixelated; box-shadow:0 0 8px #4ade80;
            animation:pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100%{box-shadow:0 0 8px #4ade80}
            50%{box-shadow:0 0 16px #4ade80,0 0 24px #4ade8066}
        }

        h1 {
            font-family:'Space Mono',monospace; font-size:26px; font-weight:700;
            color:#fff; letter-spacing:-.5px; margin-bottom:6px;
        }
        .subtitle {
            font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
            background:linear-gradient(90deg,var(--pink),var(--lavender),var(--blue));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            margin-bottom:28px;
        }

        /* LINKS */
        .links { display:flex; flex-direction:column; gap:10px; }
        .link-card {
            display:flex; align-items:center; padding:14px 18px;
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            color:#fff; text-decoration:none; border-radius:16px;
            font-weight:700; font-size:15px;
            transition:all .25s cubic-bezier(.22,1,.36,1);
            position:relative; overflow:hidden;
            animation: fadeUp .7s cubic-bezier(.22,1,.36,1) both;
            animation-delay: 1.7s; opacity:0;
        }
        .link-card:nth-child(2){ animation-delay:1.8s }
        .link-card:nth-child(3){ animation-delay:1.9s }
        .link-card::before { content:''; position:absolute; inset:0; opacity:0; transition:opacity .25s; }
        .link-card.github::before   { background:linear-gradient(90deg,rgba(255,255,255,.08),transparent) }
        .link-card.telegram::before { background:linear-gradient(90deg,rgba(41,182,246,.15),transparent) }
        .link-card.spotify::before  { background:linear-gradient(90deg,rgba(29,185,84,.15),transparent) }
        .link-card:hover { transform:translateX(6px) scale(1.02); border-color:rgba(255,255,255,.25); box-shadow:0 8px 24px rgba(0,0,0,.3); }
        .link-card:hover::before { opacity:1 }
        .link-icon { font-size:20px; width:32px; text-align:center; flex-shrink:0; }
        .github .link-icon  { color:#fff }
        .telegram .link-icon{ color:#29b6f6 }
        .spotify .link-icon { color:#1DB954 }
        .link-text { flex-grow:1; margin-left:12px; text-align:left; }
        .link-arrow { font-size:13px; opacity:.4; transition:opacity .25s,transform .25s; }
        .link-card:hover .link-arrow { opacity:.8; transform:translateX(3px) }

        /* COUNTER */
        .counter-section { display:flex; justify-content:center; margin-top:16px; opacity:.85; }
        .counter-img { height:40px; image-rendering:pixelated; }

        /* PIXEL DECO */
        .pixel-deco { display:flex; justify-content:center; gap:3px; margin-top:20px; opacity:.5; }
        .pixel { width:6px; height:6px; image-rendering:pixelated; animation:pixel-blink var(--d,2s) ease-in-out infinite; }
        @keyframes pixel-blink { 0%,100%{opacity:.3} 50%{opacity:1} }

        /* MUSIC PLAYER */
        #player {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            z-index:50;
            background:rgba(15,15,30,.88);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.1); border-radius:20px;
            padding:10px 18px;
            display:flex; align-items:center; gap:12px;
            box-shadow:0 8px 32px rgba(0,0,0,.5);
            min-width:260px; max-width:340px;
            animation: slideUp .5s cubic-bezier(.22,1,.36,1) both;
            animation-delay:2s; opacity:0;
        }
        @keyframes slideUp {
            from{opacity:0;transform:translateX(-50%) translateY(20px)}
            to{opacity:1;transform:translateX(-50%) translateY(0)}
        }
        .player-btn {
            width:36px; height:36px; border-radius:50%; border:none;
            background:linear-gradient(135deg,var(--pink),var(--lavender));
            color:white; font-size:13px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            transition:transform .2s,box-shadow .2s;
        }
        .player-btn:hover { transform:scale(1.1); box-shadow:0 0 16px rgba(196,181,253,.4) }
        .player-info { flex:1; overflow:hidden; }
        .player-title {
            font-family:'Space Mono',monospace; font-size:12px; color:#fff;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700;
        }
        .player-sub { font-size:10px; color:rgba(255,255,255,.4); margin-top:2px; letter-spacing:1px; text-transform:uppercase; }
        .player-bars { display:flex; align-items:flex-end; gap:2px; height:18px; flex-shrink:0; }
        .bar {
            width:3px;
            background:linear-gradient(to top,var(--pink),var(--lavender));
            border-radius:1px; image-rendering:pixelated;
            animation:bar-dance var(--s) ease-in-out infinite alternate;
        }
        @keyframes bar-dance { from{height:3px} to{height:18px} }
        .bar.paused { animation-play-state:paused; height:4px; }
        .player-vol { width:55px; accent-color:var(--lavender); cursor:pointer; }
    </style>
</head>
<body>

<!-- Intro -->
<div id="intro">
    <img src="https://github.com/Finodev.png" class="intro-logo" alt="">
    <div class="intro-bar"><div class="intro-bar-fill"></div></div>
    <div class="intro-text">Loading...</div>
</div>

<!-- Background -->
<div class="bg">
    <div class="bg-extra"></div>
    <div class="stars" id="stars"></div>
</div>

<!-- Main -->
<div class="container">
    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <img src="https://github.com/Finodev.png" alt="Finodev" class="avatar">
            <div class="status" title="Online"></div>
        </div>
        <h1>Finodev</h1>
        <div class="subtitle">Developer &amp; Gamer</div>
        <div class="links">
            <a href="https://github.com/Finodev" target="_blank" class="link-card github">
                <i class="fab fa-github link-icon"></i>
                <span class="link-text">Мой GitHub</span>
                <i class="fas fa-chevron-right link-arrow"></i>
            </a>
            <a href="https://t.me/finodev" target="_blank" class="link-card telegram">
                <i class="fab fa-telegram link-icon"></i>
                <span class="link-text">Мой Telegram</span>
                <i class="fas fa-chevron-right link-arrow"></i>
            </a>
            <a href="https://open.spotify.com/user/31lowi73p7ihcusslukxczxjyyqa?si=XT8xJkeSShqkEATu1RqgJg_" target="_blank" class="link-card spotify">
                <i class="fab fa-spotify link-icon"></i>
                <span class="link-text">Мой Spotify</span>
                <i class="fas fa-chevron-right link-arrow"></i>
            </a>
        </div>
    </div>
    <div class="counter-section">
        <img class="counter-img" src="https://count.getloli.com/get/@finodev?theme=moebooru" alt="MoeCounter">
    </div>
    <div class="pixel-deco" id="pixelDeco"></div>
</div>

<!-- Music player -->
<div id="player">
    <button class="player-btn" id="playBtn" title="Play/Pause">
        <i class="fas fa-play" id="playIcon"></i>
    </button>
    <div class="player-info">
        <div class="player-title" id="trackTitle">lo-fi chill beats</div>
        <div class="player-sub">finodev.radio</div>
    </div>
    <div class="player-bars">
        <div class="bar paused" style="--s:.4s;animation-delay:0s"></div>
        <div class="bar paused" style="--s:.6s;animation-delay:.1s"></div>
        <div class="bar paused" style="--s:.5s;animation-delay:.05s"></div>
        <div class="bar paused" style="--s:.7s;animation-delay:.15s"></div>
        <div class="bar paused" style="--s:.45s;animation-delay:.08s"></div>
    </div>
    <input type="range" class="player-vol" id="volSlider" min="0" max="1" step="0.05" value="0.5" title="Volume">
</div>

<script>
// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()<.3?3:Math.random()<.6?2:1;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s;opacity:${.2+Math.random()*.6}`;
    starsEl.appendChild(s);
}

// Pixel deco
const decoEl = document.getElementById('pixelDeco');
['#f0a8d0','#c4b5fd','#7dd3fc','#f0a8d0','#c4b5fd','#7dd3fc','#f0a8d0','#c4b5fd'].forEach((c,i)=>{
    const p = document.createElement('div');
    p.className='pixel';
    p.style.cssText=`background:${c};--d:${1.5+i*.2}s;animation-delay:${i*.15}s`;
    decoEl.appendChild(p);
});

// Intro hide
setTimeout(()=>document.getElementById('intro').classList.add('hidden'), 1600);

// Cursor trail — only desktop
if (!window.matchMedia('(hover: none)').matches) {
    const COLORS = ['#f0a8d0','#c4b5fd','#7dd3fc','#fff','#f0a8d0','#c4b5fd'];
    const pool = [];
    for (let i = 0; i < 20; i++) {
        const d = document.createElement('div');
        d.className = 'trail-dot';
        const sz = [3,4,6][Math.floor(Math.random()*3)];
        d.style.cssText = `width:${sz}px;height:${sz}px;background:${COLORS[i%COLORS.length]};opacity:0;position:fixed;pointer-events:none;z-index:9999;border-radius:0;image-rendering:pixelated`;
        document.body.appendChild(d);
        pool.push({el:d, x:0, y:0, life:0, max:20+Math.random()*15});
    }
    let idx=0;
    window.addEventListener('mousemove', e=>{
        const dot = pool[idx % pool.length]; idx++;
        dot.x = e.clientX; dot.y = e.clientY; dot.life = dot.max;
        dot.el.style.left = (e.clientX-2)+'px';
        dot.el.style.top  = (e.clientY-2)+'px';
        dot.el.style.opacity = '0.9';
    });
    (function animate(){
        pool.forEach(dot=>{
            if(dot.life>0){
                dot.life--;
                dot.el.style.opacity = (dot.life/dot.max*.9).toFixed(2);
                dot.x += (Math.random()-.5)*1.2;
                dot.y += (Math.random()-.5)*1.2;
                dot.el.style.left = dot.x+'px';
                dot.el.style.top  = dot.y+'px';
            }
        });
        requestAnimationFrame(animate);
    })();
}

// Music player
const TRACKS = [
    {title:'lo-fi chill beats',    url:'https://stream.zeno.fm/f3wvbbqmdg8uv'},
    {title:'lounge radio',          url:'https://stream.zeno.fm/yn65f92muzuuv'},
    {title:'chillhop essentials',   url:'https://stream.zeno.fm/0r0xa792kwzuv'},
];
let tIdx=0, playing=false;
const audio = new Audio();
audio.volume = 0.5;
const playBtn=document.getElementById('playBtn');
const playIcon=document.getElementById('playIcon');
const trackTitleEl=document.getElementById('trackTitle');
const bars=document.querySelectorAll('.bar');
const volSlider=document.getElementById('volSlider');

function loadTrack(i){ audio.src=TRACKS[i].url; trackTitleEl.textContent=TRACKS[i].title; }
loadTrack(0);

function setPlay(state){
    playing=state;
    if(playing){
        playIcon.className='fas fa-pause';
        bars.forEach(b=>b.classList.remove('paused'));
        audio.play().catch(()=>{ tIdx=(tIdx+1)%TRACKS.length; loadTrack(tIdx); audio.play().catch(()=>{}); });
    } else {
        playIcon.className='fas fa-play';
        bars.forEach(b=>b.classList.add('paused'));
        audio.pause();
    }
}
playBtn.addEventListener('click',()=>setPlay(!playing));
volSlider.addEventListener('input',()=>{ audio.volume=volSlider.value; });
audio.addEventListener('error',()=>{ tIdx=(tIdx+1)%TRACKS.length; loadTrack(tIdx); if(playing)audio.play().catch(()=>{}); });
</script>
</body>
</html>
