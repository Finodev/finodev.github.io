<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finodev | Links</title>
    <meta property="og:title" content="Finodev">
    <meta property="og:description" content="Developer & Gamer">
    <meta property="og:image" content="https://github.com/Finodev.png">
    <link rel="icon" href="https://github.com/Finodev.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #f0a8d0;
            --lavender: #c4b5fd;
            --blue: #7dd3fc;
            --dark: #0f0f1a;
            --card-bg: rgba(15, 15, 30, 0.65);
            --border: rgba(255,255,255,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            background: var(--dark);
            position: relative;
        }

        /* Animated gradient background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #1a0533, #0f0f2a, #001a33);
            overflow: hidden;
        }

        .bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196,181,253,0.18) 0%, transparent 70%);
            top: -150px;
            left: -150px;
            animation: drift1 12s ease-in-out infinite alternate;
        }

        .bg::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240,168,208,0.15) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation: drift2 10s ease-in-out infinite alternate;
        }

        .bg-extra {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(125,211,252,0.12) 0%, transparent 70%);
            bottom: 20%;
            left: 10%;
            animation: drift1 14s ease-in-out infinite alternate-reverse;
        }

        /* Pixel stars */
        .stars {
            position: absolute;
            inset: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 0;
            animation: twinkle var(--d) ease-in-out infinite;
        }

        @keyframes drift1 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(60px, 40px) scale(1.1); }
        }
        @keyframes drift2 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-50px, -30px) scale(1.08); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 36px 24px 28px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(196,181,253,0.08),
                0 20px 60px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
            image-rendering: pixelated;
            border: 3px solid transparent;
            background: linear-gradient(var(--dark), var(--dark)) padding-box,
                        linear-gradient(135deg, var(--pink), var(--lavender), var(--blue)) border-box;
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--pink), var(--lavender), var(--blue), var(--pink));
            animation: spin 4s linear infinite;
            opacity: 0.6;
            z-index: 0;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: var(--dark);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status dot */
        .status {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background: #4ade80;
            border-radius: 0;
            border: 2px solid var(--dark);
            z-index: 2;
            image-rendering: pixelated;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 8px #4ade80; }
            50% { box-shadow: 0 0 16px #4ade80, 0 0 24px #4ade8066; }
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--pink), var(--lavender), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 28px;
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }

        .link-card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .link-card.github::before { background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent); }
        .link-card.telegram::before { background: linear-gradient(90deg, rgba(41,182,246,0.15), transparent); }
        .link-card.spotify::before { background: linear-gradient(90deg, rgba(29,185,84,0.15), transparent); }

        .link-card:hover {
            transform: translateX(6px) scale(1.02);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .link-card:hover::before { opacity: 1; }

        .link-icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .github .link-icon { color: #fff; }
        .telegram .link-icon { color: #29b6f6; }
        .spotify .link-icon { color: #1DB954; }

        .link-text {
            flex-grow: 1;
            margin-left: 12px;
            text-align: left;
        }

        .link-arrow {
            font-size: 13px;
            opacity: 0.4;
            transition: opacity 0.25s, transform 0.25s;
        }

        .link-card:hover .link-arrow {
            opacity: 0.8;
            transform: translateX(3px);
        }

        /* Counter */
        .counter-section {
            display: flex;
            justify-content: center;
            margin-top: 16px;
            opacity: 0.85;
        }

        .counter-img {
            height: 40px;
            image-rendering: pixelated;
        }

        /* Pixel decoration */
        .pixel-deco {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 20px;
            opacity: 0.5;
        }

        .pixel {
            width: 6px;
            height: 6px;
            image-rendering: pixelated;
            animation: pixel-blink var(--d, 2s) ease-in-out infinite;
        }

        @keyframes pixel-blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="bg-extra"></div>
    <div class="stars" id="stars"></div>
</div>

<div class="container">
    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <img src="https://github.com/Finodev.png" alt="Finodev" class="avatar">
            <div class="status" title="Online"></div>
        </div>

        <h1>Finodev</h1>
        <div class="subtitle">Developer &amp; Gamer</div>

        <div class="links">
            <a href="https://github.com/Finodev" target="_blank" class="link-card github">
                <i class="fab fa-github link-icon"></i>
                <span class="link-text">Мой GitHub</span>
                <i class="fas fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://t.me/finodev" target="_blank" class="link-card telegram">
                <i class="fab fa-telegram link-icon"></i>
                <span class="link-text">Мой Telegram</span>
                <i class="fas fa-chevron-right link-arrow"></i>
            </a>

            <a href="https://open.spotify.com/user/31lowi73p7ihcusslukxczxjyyqa?si=XT8xJkeSShqkEATu1RqgJg_" target="_blank" class="link-card spotify">
                <i class="fab fa-spotify link-icon"></i>
                <span class="link-text">Мой Spotify</span>
                <i class="fas fa-chevron-right link-arrow"></i>
            </a>
        </div>
    </div>

    <div class="counter-section">
        <img class="counter-img" src="https://count.getloli.com/get/@finodev?theme=moebooru" alt="MoeCounter">
    </div>

    <!-- Pixel decoration -->
    <div class="pixel-deco" id="pixelDeco"></div>
</div>

<script>
    // Generate pixel stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() < 0.3 ? 3 : Math.random() < 0.6 ? 2 : 1;
        s.style.cssText = `
            width: ${size}px;
            height: ${size}px;
            top: ${Math.random() * 100}%;
            left: ${Math.random() * 100}%;
            --d: ${1.5 + Math.random() * 3}s;
            animation-delay: ${Math.random() * 3}s;
            opacity: ${0.2 + Math.random() * 0.6};
        `;
        starsEl.appendChild(s);
    }

    // Pixel decoration row
    const decoEl = document.getElementById('pixelDeco');
    const colors = ['#f0a8d0','#c4b5fd','#7dd3fc','#f0a8d0','#c4b5fd','#7dd3fc','#f0a8d0','#c4b5fd'];
    colors.forEach((c, i) => {
        const p = document.createElement('div');
        p.className = 'pixel';
        p.style.cssText = `background:${c}; --d:${1.5 + i * 0.2}s; animation-delay:${i * 0.15}s;`;
        decoEl.appendChild(p);
    });
</script>

</body>
</html>
