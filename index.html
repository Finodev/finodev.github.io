<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finodev | Links</title>
    <meta property="og:title" content="Finodev">
    <meta property="og:description" content="Developer & Gamer">
    <meta property="og:image" content="https://github.com/Finodev.png">
    <link rel="icon" href="https://github.com/Finodev.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #f0a8d0;
            --lavender: #c4b5fd;
            --blue: #7dd3fc;
            --dark: #060612;
            --card-bg: rgba(255,255,255,0.04);
            --text: #fff;
            --text-sub: rgba(255,255,255,.3);
            --border: rgba(255,255,255,0.12);
            --bg-start: #0d0420;
            --bg-mid: #060612;
            --bg-end: #00111f;
        }
        html.light {
            --dark: #f8f8ff;
            --card-bg: rgba(0,0,0,0.06);
            --text: #0a0a0a;
            --text-sub: rgba(0,0,0,.5);
            --border: rgba(0,0,0,0.12);
            --bg-start: #e8e4f5;
            --bg-mid: #f0f0f8;
            --bg-end: #e4f0ff;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            overflow-x: hidden;
            background: var(--dark);
            position: relative;
            transition: background .4s ease;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .theme-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            transition: all .3s ease;
        }
        .theme-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.1);
        }

        .click-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            border-radius: 50%;
            animation: pop 0.8s cubic-bezier(.22,1,.36,1) forwards;
        }
        @keyframes pop {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .container {
            position:relative; z-index:1;
            width:100%; max-width:360px;
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            perspective: 1200px;
        }
        @keyframes fadeInUp { 
            from{opacity:0;transform:translateY(40px)} 
            to{opacity:1;transform:translateY(0)} 
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 28px;
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            box-shadow:
                0 0 0 0.5px rgba(255,255,255,0.06) inset,
                0 2px 0 rgba(255,255,255,0.1) inset,
                0 32px 80px rgba(0,0,0,0.7),
                0 0 60px rgba(196,181,253,0.05);
            transform-style: preserve-3d;
            transition: all .4s ease;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content:'';
            position:absolute; inset:0; border-radius:28px;
            background: linear-gradient(135deg,
                rgba(255,255,255,0.08) 0%,
                rgba(255,255,255,0.02) 40%,
                rgba(255,255,255,0.06) 100%);
            pointer-events:none;
        }
        .card-inner { position: relative; z-index: 1; }

        .avatar-wrap { position:relative; display:inline-block; margin-bottom:14px; animation: fadeInScale 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
        @keyframes fadeInScale { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
        
        .avatar {
            width:85px; height:85px; border-radius:50%; object-fit:cover;
            display:block; position:relative; z-index:1;
            border:2px solid var(--border);
            box-shadow: 0 0 30px rgba(196,181,253,0.3);
        }
        .avatar-ring {
            position:absolute; inset:-5px; border-radius:50%;
            background: conic-gradient(from 0deg,var(--pink),var(--lavender),var(--blue),var(--pink));
            animation:spin 5s linear infinite; opacity:.5; z-index:0;
            filter: blur(1px);
        }
        .avatar-ring::after {
            content:''; position:absolute; inset:4px; border-radius:50%; background:var(--dark);
        }
        @keyframes spin { to{transform:rotate(360deg)} }
        .status {
            position:absolute; bottom:1px; right:1px;
            width:12px; height:12px; background:#4ade80;
            border-radius:50%; border:2px solid var(--dark); z-index:2;
            box-shadow:0 0 10px #4ade80;
            animation:pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100%{box-shadow:0 0 6px #4ade80} 50%{box-shadow:0 0 18px #4ade80,0 0 30px #4ade8044} }

        h1 {
            font-family:'Space Mono',monospace; font-size:22px; font-weight:700;
            color:var(--text); letter-spacing:-.5px; margin-bottom:18px;
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        .links { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
        .link-card {
            display:flex; align-items:center; padding:12px 14px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color:var(--text); text-decoration:none; border-radius:14px;
            font-weight:700; font-size:13px;
            transition: all .3s cubic-bezier(.22,1,.36,1);
            position:relative; overflow:hidden;
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .link-card:nth-child(1){ animation-delay: 0.4s; }
        .link-card:nth-child(2){ animation-delay: 0.5s; }
        .link-card:nth-child(3){ animation-delay: 0.6s; }
        .link-card::after {
            content:''; position:absolute; inset:0; border-radius:14px;
            background: linear-gradient(135deg,rgba(255,255,255,0.08),transparent);
            opacity:0; transition:opacity .3s;
        }
        .link-card:hover {
            transform: translateY(-2px) scale(1.015);
            border-color: var(--border);
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.09);
        }
        .link-card:hover::after { opacity:1 }
        .link-icon { font-size:17px; width:28px; text-align:center; flex-shrink:0; }
        .github .link-icon   { color:var(--text) }
        .telegram .link-icon { color:#29b6f6 }
        .spotify .link-icon  { color:#1DB954 }
        .link-text { flex-grow:1; margin-left:10px; text-align:left; }
        .link-arrow { font-size:11px; opacity:.3; transition:opacity .3s,transform .3s; }
        .link-card:hover .link-arrow { opacity:.7; transform:translateX(3px) }

        .counter-section { display:flex; justify-content:center; margin-bottom:12px; opacity:.7; animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s both; }
        .counter-img { height:32px; image-rendering:pixelated; }

        .divider { height:1px; background:var(--border); margin:12px 0; }

        .player-container {
            background: rgba(10,10,24,0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border);
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.75s both;
        }
        .player-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .player-btn {
            width:35px; height:35px; border-radius:50%; border:none;
            background: linear-gradient(135deg,var(--pink),var(--lavender));
            color:white; font-size:12px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            transition:transform .2s, box-shadow .2s;
            box-shadow: 0 4px 16px rgba(196,181,253,0.3);
        }
        .player-btn:hover { transform:scale(1.08); box-shadow:0 6px 24px rgba(196,181,253,.5) }
        .player-btn:active { transform:scale(0.95) }
        .player-info { flex:1; overflow:hidden; }
        .player-title {
            font-family:'Space Mono',monospace; font-size:10px; color:var(--text);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700;
        }
        .player-artist { font-size:9px; color:var(--text-sub); margin-top:1px; letter-spacing:0.5px; text-transform:uppercase; }
        .player-bars { display:flex; align-items:flex-end; gap:2px; height:14px; flex-shrink:0; }
        .bar {
            width:2.5px;
            background:linear-gradient(to top,var(--pink),var(--lavender));
            border-radius:1px;
            animation:bar-dance var(--s) ease-in-out infinite alternate;
        }
        @keyframes bar-dance { from{height:2px} to{height:14px} }
        .bar.paused { animation-play-state:paused; height:3px; }

        .player-bottom { display:flex; align-items:center; gap:6px; }
        .player-time { font-family:'Space Mono',monospace; font-size:8px; color:var(--text-sub); flex-shrink:0; min-width:24px; }
        .progress-wrap {
            flex:1; height:2px; background:rgba(255,255,255,.1); border-radius:1px;
            cursor:pointer; position:relative; overflow:hidden;
        }
        .progress-fill {
            height:100%; width:0%;
            background:linear-gradient(90deg,var(--pink),var(--lavender));
            border-radius:1px; transition:width .5s linear;
        }
        .player-vol { width:40px; accent-color:var(--lavender); cursor:pointer; opacity:.6; height:16px; }
        .player-vol:hover { opacity:1; }
    </style>
</head>
<body>

<button class="theme-btn" id="themeBtn" title="Toggle theme">
    <i class="fas fa-moon"></i>
</button>

<canvas id="bgCanvas"></canvas>

<div class="container" id="card">
    <div class="card">
        <div class="card-inner">
            <div class="avatar-wrap">
                <div class="avatar-ring"></div>
                <img src="https://github.com/Finodev.png" alt="Finodev" class="avatar">
                <div class="status" title="Online"></div>
            </div>
            <h1>Finodev</h1>
            <div class="links">
                <a href="https://github.com/Finodev" target="_blank" class="link-card github">
                    <i class="fab fa-github link-icon"></i>
                    <span class="link-text">GitHub</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
                <a href="https://t.me/finodev" target="_blank" class="link-card telegram">
                    <i class="fab fa-telegram link-icon"></i>
                    <span class="link-text">Telegram</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
                <a href="https://open.spotify.com/user/31lowi73p7ihcusslukxczxjyyqa?si=XT8xJkeSShqkEATu1RqgJg_" target="_blank" class="link-card spotify">
                    <i class="fab fa-spotify link-icon"></i>
                    <span class="link-text">Spotify</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
            </div>
            <div class="counter-section">
                <img class="counter-img" src="https://count.getloli.com/get/@finodev?theme=moebooru" alt="MoeCounter">
            </div>
            <div class="divider"></div>
            
            <div class="player-container">
                <div class="player-top">
                    <button class="player-btn" id="playBtn">
                        <i class="fas fa-play" id="playIcon"></i>
                    </button>
                    <div class="player-info">
                        <div class="player-title" id="trackTitle">Ты любишь танцевать</div>
                        <div class="player-artist">CUPSIZE</div>
                    </div>
                    <div class="player-bars">
                        <div class="bar paused" style="--s:.4s"></div>
                        <div class="bar paused" style="--s:.65s;animation-delay:.1s"></div>
                        <div class="bar paused" style="--s:.5s;animation-delay:.05s"></div>
                        <div class="bar paused" style="--s:.75s;animation-delay:.15s"></div>
                    </div>
                </div>
                <div class="player-bottom">
                    <span class="player-time" id="timeCur">0:00</span>
                    <div class="progress-wrap" id="progressWrap">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="player-time" id="timeDur">0:00</span>
                    <input type="range" class="player-vol" id="volSlider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ── THEME ──
const themeBtn=document.getElementById('themeBtn');
const html=document.documentElement;
const savedTheme=localStorage.getItem('theme')||'dark';
html.classList.toggle('light', savedTheme==='light');
themeBtn.innerHTML=savedTheme==='light'?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';

themeBtn.addEventListener('click',()=>{
    const isLight=html.classList.toggle('light');
    localStorage.setItem('theme', isLight?'light':'dark');
    themeBtn.innerHTML=isLight?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
});

// ── PARTICLE NETWORK CANVAS ──
(function(){
    const canvas=document.getElementById('bgCanvas');
    const ctx=canvas.getContext('2d');
    let W,H,dots=[];
    const N=70,DIST=130;
    const COLORS=['#f0a8d0','#c4b5fd','#7dd3fc'];

    function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
    resize();window.addEventListener('resize',resize);

    for(let i=0;i<N;i++)dots.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()<.3?2:1,c:COLORS[Math.floor(Math.random()*COLORS.length)],o:Math.random()*.4+.15});

    function draw(){
        ctx.clearRect(0,0,W,H);
        const root=document.documentElement;
        const isLight=root.classList.contains('light');
        const g=ctx.createLinearGradient(0,0,W,H);
        if(isLight){
            g.addColorStop(0,'#e8e4f5');g.addColorStop(.5,'#f0f0f8');g.addColorStop(1,'#e4f0ff');
        }else{
            g.addColorStop(0,'#0d0420');g.addColorStop(.5,'#060612');g.addColorStop(1,'#00111f');
        }
        ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

        dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>W)d.vx*=-1;if(d.y<0||d.y>H)d.vy*=-1;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle=d.c;ctx.globalAlpha=d.o;ctx.fill();});

        for(let i=0;i<dots.length;i++){for(let j=i+1;j<dots.length;j++){const dx=dots[i].x-dots[j].x,dy=dots[i].y-dots[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<DIST){ctx.beginPath();ctx.moveTo(dots[i].x,dots[i].y);ctx.lineTo(dots[j].x,dots[j].y);ctx.strokeStyle='rgba(196,181,253,'+(1-dist/DIST)*.12+')';ctx.globalAlpha=1;ctx.lineWidth=.5;ctx.stroke();}}}
        ctx.globalAlpha=1;
        requestAnimationFrame(draw);
    }
    draw();
})();

// ── CARD PARALLAX ──
const card=document.getElementById('card');
const cardEl=card.querySelector('.card');
const isTouch=window.matchMedia('(hover: none)').matches;

if(!isTouch){
    document.addEventListener('mousemove',e=>{
        const r=cardEl.getBoundingClientRect();
        const cx=r.left+r.width/2,cy=r.top+r.height/2;
        const dx=e.clientX-cx,dy=e.clientY-cy;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const maxDist=300;
        
        if(dist<maxDist){
            const angle=Math.atan2(dy,dx);
            const tilt=Math.sin(angle)*8;
            const rot=Math.cos(angle)*8;
            cardEl.style.transform=`perspective(1000px) rotateY(${rot}deg) rotateX(${-tilt}deg) scale(1.01)`;
        }
    });
    
    document.addEventListener('mouseleave',()=>{
        cardEl.style.transform='perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
        cardEl.style.transition='transform .6s cubic-bezier(.22,1,.36,1)';
    });
    document.addEventListener('mouseenter',()=>{cardEl.style.transition='transform .1s ease';});
}

// ── CLICK PARTICLES ──
const PARTICLE_COLORS=['#f0a8d0','#c4b5fd','#7dd3fc'];

function createParticles(x,y){
    for(let i=0;i<8;i++){
        const p=document.createElement('div');
        p.className='click-particle';
        const size=Math.random()*8+4;
        const angle=Math.random()*Math.PI*2;
        const velocity=Math.random()*150+100;
        const tx=Math.cos(angle)*velocity;
        const ty=Math.sin(angle)*velocity;
        
        p.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${PARTICLE_COLORS[Math.floor(Math.random()*PARTICLE_COLORS.length)]};--tx:${tx}px;--ty:${ty}px;`;
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 800);
    }
}

document.addEventListener('click',e=>createParticles(e.clientX,e.clientY));
document.addEventListener('touchstart',e=>createParticles(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

// ── PLAYER ──
const TRACKS=[{title:'Ты любишь танцевать',url:'https://raw.githubusercontent.com/Finodev/finodev.github.io/main/2_5238062214925008099%20(2).mp3'}];
let playing=false;
const audio=new Audio();audio.volume=.5;audio.loop=true;
const playBtn=document.getElementById('playBtn');
const playIcon=document.getElementById('playIcon');
const bars=document.querySelectorAll('.bar');
const volSlider=document.getElementById('volSlider');
const progressFill=document.getElementById('progressFill');
const progressWrap=document.getElementById('progressWrap');
const timeCur=document.getElementById('timeCur');
const timeDur=document.getElementById('timeDur');

function fmt(s){const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0');}

audio.src=TRACKS[0].url;
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;const pct=(audio.currentTime/audio.duration)*100;progressFill.style.width=pct+'%';timeCur.textContent=fmt(audio.currentTime);});
audio.addEventListener('loadedmetadata',()=>{timeDur.textContent=fmt(audio.duration);});

progressWrap.addEventListener('click',e=>{const r=progressWrap.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;});

function setPlay(state){
    playing=state;
    if(playing){
        playIcon.className='fas fa-pause';
        bars.forEach(b=>b.classList.remove('paused'));
        audio.play().catch(()=>{});
    }else{
        playIcon.className='fas fa-play';
        bars.forEach(b=>b.classList.add('paused'));
        audio.pause();
    }
}
playBtn.addEventListener('click',()=>setPlay(!playing));
volSlider.addEventListener('input',()=>{ audio.volume=volSlider.value; });
</script>
</body>
</html>
