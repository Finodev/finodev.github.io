<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finodev | Links</title>
    <meta property="og:title" content="Finodev">
    <meta property="og:description" content="Developer & Gamer">
    <meta property="og:image" content="https://github.com/Finodev.png">
    <link rel="icon" href="https://github.com/Finodev.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="theme-btn" id="themeBtn" title="Toggle theme">
    <i class="fas fa-moon"></i>
</button>

<canvas id="bgCanvas"></canvas>

<!-- MOBILE LAYOUT -->
<div class="container mobile-layout" id="card">
    <div class="card">
        <div class="card-inner">
            <div class="avatar-wrap">
                <div class="avatar-ring"></div>
                <img src="https://github.com/Finodev.png" alt="Finodev" class="avatar">
                <div class="status" title="Online"></div>
            </div>
            <h1>Finodev</h1>
            <div class="badges">
                <span class="badge badge-html"><i class="fab fa-html5"></i> HTML</span>
                <span class="badge badge-css"><i class="fab fa-css3-alt"></i> CSS</span>
                <span class="badge badge-python"><i class="fab fa-python"></i> Python</span>
            </div>
            <div class="links">
                <a href="https://github.com/Finodev" target="_blank" class="link-card github">
                    <i class="fab fa-github link-icon"></i>
                    <span class="link-text">GitHub</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
                <a href="https://t.me/finodev" target="_blank" class="link-card telegram">
                    <i class="fab fa-telegram link-icon"></i>
                    <span class="link-text">Telegram</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
                <a href="https://open.spotify.com/user/31lowi73p7ihcusslukxczxjyyqa" target="_blank" class="link-card spotify">
                    <i class="fab fa-spotify link-icon"></i>
                    <span class="link-text">Spotify</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
            </div>
            <div class="counter-section">
                <img class="counter-img" src="https://count.getloli.com/get/@finodev?theme=moebooru" alt="MoeCounter">
            </div>
            <div class="divider"></div>
            <div class="player-container">
                <div class="player-top">
                    <button class="player-btn" id="playBtnMobile">
                        <i class="fas fa-play" id="playIconMobile"></i>
                    </button>
                    <div class="player-info">
                        <div class="player-title">Ты любишь танцевать</div>
                        <div class="player-artist">CUPSIZE</div>
                    </div>
                    <div class="player-bars" id="barsMobile">
                        <div class="bar paused" style="--s:.4s"></div>
                        <div class="bar paused" style="--s:.65s;animation-delay:.1s"></div>
                        <div class="bar paused" style="--s:.5s;animation-delay:.05s"></div>
                        <div class="bar paused" style="--s:.75s;animation-delay:.15s"></div>
                    </div>
                </div>
                <div class="player-bottom">
                    <span class="player-time" id="timeCurMobile">0:00</span>
                    <div class="progress-wrap" id="progressWrapMobile">
                        <div class="progress-fill" id="progressFillMobile"></div>
                    </div>
                    <span class="player-time" id="timeDurMobile">0:00</span>
                    <input type="range" class="player-vol" id="volSliderMobile" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- DESKTOP LAYOUT -->
<div class="desktop-layout" id="desktopCard">
    <div class="desk-card">

        <!-- TOP ROW -->
        <div class="desk-top">

            <!-- LEFT: avatar + badges -->
            <div class="desk-left">
                <div class="avatar-wrap">
                    <div class="avatar-ring"></div>
                    <img src="https://github.com/Finodev.png" alt="Finodev" class="avatar avatar-lg">
                    <div class="status" title="Online"></div>
                </div>
                <h1 class="desk-name">Finodev</h1>
                <div class="badges">
                    <span class="badge badge-html"><i class="fab fa-html5"></i> HTML</span>
                    <span class="badge badge-css"><i class="fab fa-css3-alt"></i> CSS</span>
                    <span class="badge badge-python"><i class="fab fa-python"></i> Python</span>
                </div>
                <div class="counter-section" style="margin-top:14px;margin-bottom:0;">
                    <img class="counter-img" src="https://count.getloli.com/get/@finodev?theme=moebooru" alt="MoeCounter">
                </div>
            </div>

            <!-- DIVIDER -->
            <div class="desk-vdivider"></div>

            <!-- RIGHT: links -->
            <div class="desk-right">
                <a href="https://open.spotify.com/user/31lowi73p7ihcusslukxczxjyyqa" target="_blank" class="link-card spotify desk-link">
                    <i class="fab fa-spotify link-icon"></i>
                    <span class="link-text">Spotify</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
                <a href="https://t.me/finodev" target="_blank" class="link-card telegram desk-link">
                    <i class="fab fa-telegram link-icon"></i>
                    <span class="link-text">Telegram</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
                <a href="https://github.com/Finodev" target="_blank" class="link-card github desk-link">
                    <i class="fab fa-github link-icon"></i>
                    <span class="link-text">GitHub</span>
                    <i class="fas fa-chevron-right link-arrow"></i>
                </a>
            </div>
        </div>

        <!-- BOTTOM: player -->
        <div class="desk-hdivider"></div>
        <div class="desk-bottom">
            <button class="player-btn" id="playBtnDesk">
                <i class="fas fa-play" id="playIconDesk"></i>
            </button>
            <div class="player-info" style="min-width:120px;max-width:160px;">
                <div class="player-title">Ты любишь танцевать</div>
                <div class="player-artist">CUPSIZE</div>
            </div>
            <div class="player-bars" id="barsDesk">
                <div class="bar paused" style="--s:.4s"></div>
                <div class="bar paused" style="--s:.65s;animation-delay:.1s"></div>
                <div class="bar paused" style="--s:.5s;animation-delay:.05s"></div>
                <div class="bar paused" style="--s:.75s;animation-delay:.15s"></div>
            </div>
            <span class="player-time" id="timeCurDesk">0:00</span>
            <div class="progress-wrap" id="progressWrapDesk">
                <div class="progress-fill" id="progressFillDesk"></div>
            </div>
            <span class="player-time" id="timeDurDesk">0:00</span>
            <input type="range" class="player-vol" id="volSliderDesk" min="0" max="1" step="0.05" value="0.5">
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
